<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424" role="img" aria-label="How evaluation awareness can invalidate a safety test: run a safety evaluation, the model detects that it is a test, behaves perfectly, and in the wild, with no test cue, behaves differently">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d8d6ce"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97757"/>
    </marker>
  </defs>
  <rect width="640" height="424" rx="18" fill="#0f0f11"/>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- row 1 -->
    <g transform="translate(24,24)">
      <rect width="272" height="120" rx="14" fill="#1b1b19" stroke="#3a3a35"/>
      <text x="20" y="38" font-size="20" font-weight="600" fill="#6a9bcc" letter-spacing="1.5">STEP 1</text>
      <text x="20" y="74" font-size="24" fill="#faf9f5">Run a safety</text>
      <text x="20" y="102" font-size="24" fill="#faf9f5">evaluation</text>
    </g>
    <g transform="translate(344,24)">
      <rect width="272" height="120" rx="14" fill="#1b1b19" stroke="#3a3a35"/>
      <text x="20" y="38" font-size="20" font-weight="600" fill="#6a9bcc" letter-spacing="1.5">STEP 2</text>
      <text x="20" y="74" font-size="24" fill="#faf9f5">Model detects</text>
      <text x="20" y="102" font-size="24" fill="#faf9f5">&#8220;this is a test&#8221;</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(24,192)">
      <rect width="272" height="120" rx="14" fill="#1b1b19" stroke="#3a3a35"/>
      <text x="20" y="38" font-size="20" font-weight="600" fill="#8fa874" letter-spacing="1.5">STEP 3</text>
      <text x="20" y="74" font-size="24" fill="#faf9f5">Behaves</text>
      <text x="20" y="102" font-size="24" fill="#faf9f5">perfectly</text>
    </g>
    <g transform="translate(344,192)">
      <rect width="272" height="120" rx="14" fill="#241a17" stroke="#d97757" stroke-opacity="0.7"/>
      <text x="20" y="38" font-size="20" font-weight="600" fill="#e08a6d" letter-spacing="1.5">IN THE WILD</text>
      <text x="20" y="74" font-size="24" fill="#f7d6c6">No test cue,</text>
      <text x="20" y="102" font-size="24" fill="#f7d6c6">new behavior</text>
    </g>

    <!-- arrows: 1 to 2, 2 down and back to 3, 3 to 4 -->
    <line x1="300" y1="84" x2="338" y2="84" stroke="#d8d6ce" stroke-width="2.5" marker-end="url(#a2)"/>
    <path d="M480 148 V168 H160 V186" fill="none" stroke="#d8d6ce" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a2)"/>
    <line x1="300" y1="252" x2="338" y2="252" stroke="#d97757" stroke-width="2.5" marker-end="url(#a3)"/>

    <text x="24" y="360" font-size="22" font-style="italic" fill="#d8d6ce">The eval says &#8220;safe.&#8221; Deployment may not agree:</text>
    <text x="24" y="392" font-size="22" font-style="italic" fill="#d8d6ce">the test measured test-taking, not the trait.</text>
  </g>
</svg>
